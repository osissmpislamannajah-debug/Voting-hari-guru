<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Grand Teacher Awards 2026</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#facc15', 500: '#eab308' },
                        darkBg: '#090a0f'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                        serif: ['Cinzel', 'Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #06070a;
            color: #f3f4f6;
        }
        .glass-panel {
            background: rgba(18, 20, 29, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">

    <div class="max-w-6xl mx-auto space-y-6">

        <!-- HEADER ADMIN -->
        <header class="glass-panel p-6 rounded-3xl flex flex-col sm:flex-row justify-between items-center gap-4 border-rose-500/20 bg-rose-950/10">
            <div>
                <div class="flex items-center gap-2 text-rose-400 text-xs font-bold uppercase tracking-wider">
                    <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping"></span>
                    Admin Central Panel
                </div>
                <h1 class="text-3xl font-bold text-white mt-1">Kelola Data E-Voting</h1>
                <p class="text-xs text-slate-400 mt-1">Terhubung langsung ke database Google Sheets & Cloud Sync</p>
            </div>
            <div class="flex gap-2">
                <a href="index.html" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold flex items-center gap-2 transition">
                    ← Portal
                </a>
                <a href="results.html" class="px-4 py-2 rounded-xl bg-purple-950/60 border border-purple-500/30 text-purple-300 text-xs font-semibold flex items-center gap-2 transition">
                    📊 Live Results
                </a>
            </div>
        </header>

        <!-- DASHBOARD DATA STATS -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="glass-panel p-5 rounded-2xl border border-amber-500/20">
                <p class="text-xs text-slate-400 font-semibold uppercase">Total Entri Masuk</p>
                <h3 id="stat-total-docs" class="text-3xl font-extrabold text-amber-400 mt-1">0</h3>
            </div>
            <div class="glass-panel p-5 rounded-2xl border border-pink-500/20">
                <p class="text-xs text-slate-400 font-semibold uppercase">Kategori Guru Tergaul</p>
                <h3 id="stat-tergaul-count" class="text-3xl font-extrabold text-pink-400 mt-1">0</h3>
            </div>
            <div class="glass-panel p-5 rounded-2xl border border-purple-500/20">
                <p class="text-xs text-slate-400 font-semibold uppercase">Kategori Guru Terbaik</p>
                <h3 id="stat-terbaik-count" class="text-3xl font-extrabold text-purple-400 mt-1">0</h3>
            </div>
        </div>

        <!-- TABLE SECTION -->
        <div class="glass-panel p-6 rounded-3xl space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <input type="text" id="admin-search-input" oninput="renderAdminVoteList()" placeholder="Cari Voter ID / Nama Guru..." class="w-full sm:w-80 px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-amber-500">
                <button onclick="refreshData()" class="px-4 py-2 bg-amber-500/10 border border-amber-500/30 text-amber-400 rounded-xl text-xs font-semibold hover:bg-amber-500/20 transition">
                    🔄 Refresh Data
                </button>
            </div>

            <div class="overflow-x-auto rounded-2xl border border-slate-800">
                <table class="w-full text-left text-xs sm:text-sm font-mono">
                    <thead class="bg-slate-900/90 text-slate-400 uppercase text-[11px] tracking-wider border-b border-slate-800">
                        <tr>
                            <th class="p-3.5">Voter ID</th>
                            <th class="p-3.5">Pilihan Guru Tergaul</th>
                            <th class="p-3.5">Pilihan Guru Terbaik</th>
                            <th class="p-3.5 text-center">Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="admin-votes-tbody" class="divide-y divide-slate-800/60 bg-slate-900/30">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL CONFIRM DELETE -->
    <div id="delete-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel max-w-sm w-full p-6 rounded-3xl border border-rose-500/30 space-y-4 text-center">
            <div class="w-12 h-12 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-400 mx-auto text-xl">⚠️</div>
            <h3 class="text-lg font-bold text-white">Hapus Permanen?</h3>
            <p id="delete-modal-text" class="text-xs text-slate-300 bg-slate-900 p-3 rounded-xl border border-slate-800 font-mono"></p>
            <div class="flex gap-3">
                <button onclick="closeDeleteModal()" class="w-1/2 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">Batal</button>
                <button id="confirm-delete-btn" class="w-1/2 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition">Hapus</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const GOOGLE_SHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3lFHsCOp_jPvE1033xQMbkS3aW54laSDr3Ae4TLMptZepaCmG_mGuVSjcbonF46BtiQ/exec";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'evoting-guru-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDemoConfigForVotingSystemOnly",
            authDomain: "evoting-guru.firebaseapp.com",
            projectId: "evoting-guru",
            storageBucket: "evoting-guru.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.rawVotesDocs = [];
        window.pendingDeleteId = null;

        window.addEventListener('load', () => {
            fetchVotesFromGoogleSheet();
            setupRealtimeVotesListener();
        });

        window.refreshData = function() {
            fetchVotesFromGoogleSheet();
        };

        async function fetchVotesFromGoogleSheet() {
            try {
                const res = await fetch(GOOGLE_SHEET_SCRIPT_URL + "?action=getVotes");
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        window.rawVotesDocs = data.map(item => ({
                            id: item.id,
                            tergaul: item.tergaul || null,
                            terbaik: item.terbaik || null
                        }));
                        renderAdminVoteList();
                    }
                }
            } catch (e) {}
        }

        function setupRealtimeVotesListener() {
            const publicVotesRef = collection(db, 'artifacts', appId, 'public', 'data', 'votes');
            onSnapshot(publicVotesRef, (snapshot) => {
                snapshot.forEach((docSnap) => {
                    const docId = docSnap.id;
                    const data = docSnap.data();
                    const existingIdx = window.rawVotesDocs.findIndex(d => d.id === docId);
                    if (existingIdx >= 0) {
                        window.rawVotesDocs[existingIdx] = { id: docId, ...data };
                    } else {
                        window.rawVotesDocs.push({ id: docId, ...data });
                    }
                });
                renderAdminVoteList();
            });
        }

        window.renderAdminVoteList = function() {
            const tbody = document.getElementById('admin-votes-tbody');
            if (!tbody) return;

            const search = (document.getElementById('admin-search-input')?.value || '').toLowerCase();
            const filtered = window.rawVotesDocs.filter(d => 
                d.id.toLowerCase().includes(search) || 
                (d.tergaul && d.tergaul.toLowerCase().includes(search)) || 
                (d.terbaik && d.terbaik.toLowerCase().includes(search))
            );

            document.getElementById('stat-total-docs').innerText = filtered.length;
            document.getElementById('stat-tergaul-count').innerText = filtered.filter(d => d.tergaul).length;
            document.getElementById('stat-terbaik-count').innerText = filtered.filter(d => d.terbaik).length;

            tbody.innerHTML = '';
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-500">Tidak ada entri data.</td></tr>`;
                return;
            }

            filtered.forEach(docData => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/40 transition";
                tr.innerHTML = `
                    <td class="p-3.5 text-slate-300">${docData.id}</td>
                    <td class="p-3.5 text-pink-400 font-semibold">${docData.tergaul || '-'}</td>
                    <td class="p-3.5 text-amber-400 font-semibold">${docData.terbaik || '-'}</td>
                    <td class="p-3.5 text-center">
                        <button onclick="promptDeleteVote('${docData.id}')" class="px-3 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg text-xs transition">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        window.promptDeleteVote = function(id) {
            window.pendingDeleteId = id;
            document.getElementById('delete-modal-text').innerText = `ID Pemilih: ${id}`;
            document.getElementById('delete-modal').classList.remove('hidden');
        };

        window.closeDeleteModal = function() {
            document.getElementById('delete-modal').classList.add('hidden');
            window.pendingDeleteId = null;
        };

        document.getElementById('confirm-delete-btn').onclick = async function() {
            if (!window.pendingDeleteId) return;
            const targetId = window.pendingDeleteId;

            window.rawVotesDocs = window.rawVotesDocs.filter(d => d.id !== targetId);
            renderAdminVoteList();
            closeDeleteModal();

            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'votes', targetId));
            } catch(e) {}
        };
    </script>
</body>
</html>
