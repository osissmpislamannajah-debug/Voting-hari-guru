<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Guru - Grand Teacher Awards 2026</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { gold: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' } },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], serif: ['Cinzel', 'serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #06070a; color: #f3f4f6; }
        .glass-panel { background: rgba(18, 20, 29, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: linear-gradient(145deg, rgba(30, 35, 51, 0.7), rgba(15, 18, 28, 0.8)); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.3s; }
        .glass-card:hover { transform: translateY(-4px); border-color: rgba(234, 179, 8, 0.4); }
        .gold-button { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); transition: all 0.3s ease; }
        .gold-button:hover:not(:disabled) { background: linear-gradient(135deg, #facc15 0%, #eab308 100%); transform: translateY(-2px); }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">

    <div class="max-w-6xl mx-auto space-y-6">

        <!-- HEADER -->
        <header class="glass-panel p-6 rounded-3xl flex flex-col sm:flex-row justify-between items-center gap-4 border-amber-500/20">
            <div>
                <span class="text-xs text-amber-400 font-bold uppercase tracking-wider">🔥 Area Voting Utama</span>
                <h1 class="text-3xl font-bold text-white mt-1">Pilih Guru Pilihan Anda</h1>
            </div>
            <div class="flex gap-3">
                <a href="index.html" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold">← Beranda Portal</a>
                <a href="results.html" class="px-4 py-2 rounded-xl bg-purple-950/60 hover:bg-purple-900 border border-purple-500/30 text-purple-300 text-xs font-semibold">📊 Hasil Real-Time</a>
            </div>
        </header>

        <!-- STATUS -->
        <div class="glass-panel rounded-2xl p-4 border border-amber-500/20">
            <p id="status-desc" class="text-sm text-slate-300">Memuat status hak suara Anda...</p>
        </div>

        <!-- CATEGORY TABS -->
        <div class="flex justify-center p-1.5 bg-slate-900/80 rounded-2xl border border-slate-800 max-w-md mx-auto">
            <button id="tab-tergaul" onclick="switchCategory('tergaul')" class="flex-1 py-3 rounded-xl text-xs font-bold uppercase bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950">🔥 Guru Tergaul</button>
            <button id="tab-terbaik" onclick="switchCategory('terbaik')" class="flex-1 py-3 rounded-xl text-xs font-bold uppercase text-slate-400">⭐ Guru Terbaik</button>
        </div>

        <!-- SEARCH -->
        <div class="glass-panel p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-4">
            <input type="text" id="search-input" oninput="renderTeachers()" placeholder="Cari nama guru..." class="w-full sm:w-80 px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-amber-500">
            <div class="text-xs text-slate-400">Total Guru: <span id="total-teachers-count" class="text-amber-400 font-bold">0</span></div>
        </div>

        <!-- TEACHERS GRID -->
        <div id="teachers-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

    </div>

    <!-- MODAL VOTE -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel max-w-sm w-full p-6 rounded-3xl border border-amber-500/30 space-y-5 text-center">
            <h3 class="text-lg font-bold text-white">Konfirmasi Pilihan</h3>
            <div id="modal-text" class="text-sm text-slate-300 bg-slate-900 p-3 rounded-xl border border-slate-800"></div>
            <div class="flex gap-3">
                <button onclick="closeModal()" class="w-1/2 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">Batal</button>
                <button id="modal-confirm-btn" class="w-1/2 py-2.5 rounded-xl gold-button text-slate-950 text-xs font-bold">Ya, Tetapkan!</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const GOOGLE_SHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3lFHsCOp_jPvE1033xQMbkS3aW54laSDr3Ae4TLMptZepaCmG_mGuVSjcbonF46BtiQ/exec";
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'evoting-guru-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "AIzaSyDemoConfigForVotingSystemOnly", projectId: "evoting-guru" };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const teacherNames = [
            "Pak Wildan", "Pak masroni", "Pak Fakhri", "Pak Zailani", "Pak Fauzi", 
            "Pak Ikrom", "Pak vickry", "Pak Hilmi", "Pak guntur", "Pak Suryadi", 
            "Pak amar", "Pak uslani", "Pak Kiki", "Bu Devi", "Bu naila", "Bu Ririn", 
            "Bu Kurnia", "Bu Syarifah", "Bu Ima", "Bu Widi", "Miss ilfa", 
            "Miss Dilla", "Ustadzah hidyah", "Ustadz Syarif", "Ustadz Fata"
        ];

        window.currentCategory = 'tergaul';
        window.myVotes = { tergaul: null, terbaik: null };

        window.addEventListener('load', async () => {
            let storedId = localStorage.getItem('evoting_voter_id') || 'voter_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('evoting_voter_id', storedId);
            
            const saved = localStorage.getItem('evoting_my_votes');
            if (saved) { try { window.myVotes = JSON.parse(saved); } catch(e){} }
            
            updateVoteStatusBanner();
            renderTeachers();
            try { await signInAnonymously(auth); } catch(e){}
        });

        window.switchCategory = function(cat) {
            window.currentCategory = cat;
            document.getElementById('tab-tergaul').className = cat === 'tergaul' ? "flex-1 py-3 rounded-xl text-xs font-bold uppercase bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950" : "flex-1 py-3 rounded-xl text-xs font-bold uppercase text-slate-400";
            document.getElementById('tab-terbaik').className = cat === 'terbaik' ? "flex-1 py-3 rounded-xl text-xs font-bold uppercase bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950" : "flex-1 py-3 rounded-xl text-xs font-bold uppercase text-slate-400";
            renderTeachers();
        };

        window.renderTeachers = function() {
            const grid = document.getElementById('teachers-grid');
            const search = (document.getElementById('search-input')?.value || '').toLowerCase();
            const filtered = teacherNames.filter(n => n.toLowerCase().includes(search));
            document.getElementById('total-teachers-count').innerText = filtered.length;
            grid.innerHTML = '';

            const chosen = window.myVotes[window.currentCategory];
            filtered.forEach(name => {
                const isSelected = chosen === name;
                const card = document.createElement('div');
                card.className = `glass-card p-5 rounded-2xl flex flex-col justify-between space-y-4 border ${isSelected ? 'border-amber-500 bg-amber-950/20' : 'border-slate-800'}`;
                card.innerHTML = `
                    <div>
                        <h4 class="font-bold text-slate-100 text-lg">${name}</h4>
                        <p class="text-xs text-slate-400 mt-1">${window.currentCategory === 'tergaul' ? '🔥 Guru Tergaul' : '⭐ Guru Terbaik'}</p>
                    </div>
                    <button onclick="promptVote('${name}')" ${isSelected ? 'disabled' : ''} class="w-full py-2.5 rounded-xl font-bold text-xs uppercase ${isSelected ? 'bg-slate-800 text-slate-500' : 'gold-button text-slate-950'}">
                        ${isSelected ? '✔ Terpilih' : 'Vote Guru Ini'}
                    </button>
                `;
                grid.appendChild(card);
            });
        };

        window.promptVote = function(name) {
            window.pendingVote = { category: window.currentCategory, name };
            document.getElementById('modal-text').innerHTML = `Memilih <strong class="text-amber-300">${name}</strong>?`;
            document.getElementById('confirm-modal').classList.remove('hidden');
        };

        window.closeModal = function() { document.getElementById('confirm-modal').classList.add('hidden'); };

        document.getElementById('modal-confirm-btn').onclick = async function() {
            if (!window.pendingVote) return;
            const { category, name } = window.pendingVote;
            window.myVotes[category] = name;
            localStorage.setItem('evoting_my_votes', JSON.stringify(window.myVotes));
            closeModal();
            updateVoteStatusBanner();
            renderTeachers();

            const voterId = localStorage.getItem('evoting_voter_id');

            // Send to Google Sheets
            fetch(GOOGLE_SHEET_SCRIPT_URL, {
                method: "POST", mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ category, teacherName: name, voterId })
            }).catch(() => {});

            // Send to Firestore
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'votes', voterId), { [category]: name }, { merge: true });
            } catch(e) {}
        };

        function updateVoteStatusBanner() {
            const desc = document.getElementById('status-desc');
            if (window.myVotes.tergaul && window.myVotes.terbaik) {
                desc.innerHTML = `✔ Tergaul: <b class="text-amber-400">${window.myVotes.tergaul}</b> • Terbaik: <b class="text-amber-400">${window.myVotes.terbaik}</b>`;
            } else if (window.myVotes.tergaul) {
                desc.innerHTML = `Tergaul: <b class="text-amber-400">${window.myVotes.tergaul}</b> (Silakan tentukan Guru Terbaik)`;
            } else if (window.myVotes.terbaik) {
                desc.innerHTML = `Terbaik: <b class="text-amber-400">${window.myVotes.terbaik}</b> (Silakan tentukan Guru Tergaul)`;
            } else {
                desc.innerText = "Silakan tentukan 1 Guru Tergaul dan 1 Guru Terbaik pilihan Anda.";
            }
        }
    </script>
</body>
</html>
